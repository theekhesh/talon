[package]
name = "talon"
version = "0.1.0"
edition = "2021"
description = "Talon - a privacy-first, lightweight Linux web browser"
authors = ["Your Name <you@example.com>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/yourname/talon-browser"
readme = "README.md"
keywords = ["browser", "webkitgtk", "gtk4", "privacy", "linux"]
categories = ["gui", "web-programming"]

[[bin]]
name = "talon"
path = "src/main.rs"

[dependencies]
gtk4 = "0.7"
libadwaita = { version = "0.5", features = ["v1_4"] }
webkit6 = "0.3"
rusqlite = { version = "0.31", features = ["bundled-sqlcipher"] }
secret-service = "3.0"
tokio = { version = "1", features = ["full"] }
